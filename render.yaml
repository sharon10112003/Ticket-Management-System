services:
  - type: web
    name: tms-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  - type: web
    name: tms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
    - key: VITE_API_URL
      fromService:
        type: web
        name: tms-backend
        envVarKey: RENDER_EXTERNAL_URL
    routes:
    - type: rewrite
      source: /*
      destination: /index.html 